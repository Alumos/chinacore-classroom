name: Build and publish container

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=semver,pattern={{version}}
            type=sha
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container startup and persistence volume
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          IMAGE="${{ steps.image.outputs.name }}:sha-${GITHUB_SHA::7}"
          docker pull "$IMAGE"
          docker run -d --name classroom-smoke --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -v classroom-smoke-data:/data -p 127.0.0.1:18080:18080 "$IMAGE"
          trap 'docker logs classroom-smoke; docker rm -f classroom-smoke; docker volume rm classroom-smoke-data' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/health
          curl -fsS http://127.0.0.1:18080/screen > /dev/null
          curl -fsS http://127.0.0.1:18080/teacher > /dev/null
          curl -fsS http://127.0.0.1:18080/join > /dev/null
          curl -fsS -H 'Content-Type: application/json' \
            -d '{"content":"Docker smoke test","category":"芯片","clientId":"ci","submissionId":"first"}' \
            http://127.0.0.1:18080/api/messages > /dev/null
          docker restart classroom-smoke
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/admin/state | \
            python3 -c 'import json,sys; assert json.load(sys.stdin)["stats"]["total"] == 1'
          curl -fsS -X DELETE http://127.0.0.1:18080/api/admin/messages > /dev/null
          curl -fsS http://127.0.0.1:18080/api/state | \
            python3 -c 'import json,sys; assert json.load(sys.stdin)["stats"]["total"] == 0'
